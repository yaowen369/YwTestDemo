plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

//apply plugin: 'com.android.library'
//apply plugin: 'kotlin-android'

android {
    namespace 'ywdemo.example.yaoxiaowen'
    compileSdk 33

    defaultConfig {
        applicationId "ywdemo.example.yaoxiaowen"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    viewBinding {
        enable = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            // 排除重复的annotations文件
            excludes += 'META-INF/annotations/**'
            excludes += '**/annotations/**'
        }
        // 处理libc++_shared.so重复问题（百度SDK需要）
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // 依赖协程核心库
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines"
    //   依赖当前平台所对应的平台库
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlin_coroutines"

    implementation 'com.tencent:mmkv:1.3.5'

    // 添加 百度人脸face 相关sdk
    api fileTree(include: ['*.jar'], dir: 'libs')
    // 注意：不需要显式添加 annotations-java5 依赖，
    // Kotlin插件已经自动引入了更新的 annotations 库
    api files('libs/orbbec_module-debug.aar')
    api files('libs/ImiSDK.aar')
    api files('libs/deptrumSDK.aar')
    api files('libs/opencv.aar')
    api files('libs/FaceSDK_8.5_20241205-release.aar')
}