plugins {
    id 'com.android.application'
// 已删除Kotlin插件
//    id 'org.jetbrains.kotlin.android'
}

//apply plugin: 'com.android.library'
//apply plugin: 'kotlin-android'

android {
    namespace 'ywdemo.example.yaoxiaowen'
    compileSdk 33

    defaultConfig {
        applicationId "ywdemo.example.yaoxiaowen"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        multiDexEnabled true

        // 参考百度官方demo，支持 armeabi-v7a 和 arm64-v8a 架构
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    viewBinding {
        enable = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets.main {
        jniLibs.srcDirs = ["src/main/jniLibs"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
// 已删除kotlinOptions配置块
//    kotlinOptions {
//        jvmTarget = '1.8'
//    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/annotations/**'
            excludes += '**/annotations/**'
        }
        // 处理libc++_shared.so重复问题（opencv和FaceSDK都包含）
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
    }
}

dependencies {
// 已删除Kotlin扩展库依赖
//    implementation 'androidx.core:core-ktx:1.8.0'
//    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
    implementation 'androidx.core:core:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.3.1'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

// 已删除Kotlin协程依赖
//    // 依赖协程核心库
//    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines"
//    //   依赖当前平台所对应的平台库
//    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlin_coroutines"

    implementation 'com.tencent:mmkv-static:1.2.16' // 使用支持armeabi-v7a的版本

    // 添加 百度人脸face 相关sdk
    // orbbec_module-debug.aar 包含完整的 OpenNI 库（libs/openni2.3.jar 和 jni/*.so）
    api files('libs/orbbec_module-debug.aar')
    api fileTree(include: ['*.jar'], dir: 'libs')
    api files('libs/ImiSDK.aar')
    api files('libs/deptrumSDK.aar')
    api files('libs/opencv.aar')
    api files('libs/FaceSDK_8.5_20241205-release.aar')
}